# Pipeline Configuration
# This file contains all configuration for the Glue data pipeline

# Environment
environment: production
region: us-east-1

# S3 Paths
s3:
  bucket: my-iceberg-data-lake
  raw_path: raw/
  processed_path: processed/
  curated_path: curated/iceberg/
  temp_path: temp/
  scripts_path: scripts/
  metadata_path: metadata/

# AWS Resources
aws:
  glue_role: GlueIcebergRole
  glue_version: "4.0"
  worker_type: G.1X
  number_of_workers: 10
  
# Connections
connections:
  redshift:
    connection_name: redshift-connection
    database: analytics
    secret_name: prod/redshift/credentials
  
  teradata:
    connection_name: teradata-connection
    database: analytics
    secret_name: prod/teradata/credentials
  
  bigquery:
    project_id: your-gcp-project
    dataset: analytics
    secret_name: prod/bigquery/credentials

# Tables Configuration
tables:
  customers:
    source: redshift
    source_table: customers
    target_table: iceberg_curated.customers
    partition_by: [country]
    primary_key: [customer_id]
    incremental_column: last_updated
    
  orders:
    source: redshift
    source_table: orders
    target_table: iceberg_curated.orders
    partition_by: [order_date]
    primary_key: [order_id]
    incremental_column: created_at
  
  products:
    source: teradata
    source_table: products
    target_table: iceberg_curated.products
    partition_by: [category]
    primary_key: [product_id]
    incremental_column: created_date
  
  transactions:
    source: bigquery
    source_table: transactions
    target_table: iceberg_curated.transactions
    partition_by: [transaction_date]
    primary_key: [transaction_id]
    incremental_column: created_at

# Iceberg Configuration
iceberg:
  catalog: glue_catalog
  warehouse: s3://my-iceberg-data-lake/curated/iceberg/
  database: iceberg_curated
  
  # Maintenance settings
  maintenance:
    compact_files_enabled: true
    target_file_size_mb: 512
    expire_snapshots_days: 30
    retain_last_snapshots: 5

# Data Quality Rules
data_quality:
  customers:
    checks:
      - type: null_check
        column: customer_id
        threshold: 0.0
      - type: null_check
        column: email
        threshold: 0.05
      - type: uniqueness
        column: customer_id
      - type: uniqueness
        column: email
  
  orders:
    checks:
      - type: null_check
        column: order_id
        threshold: 0.0
      - type: row_count
        min_rows: 1

# Monitoring
monitoring:
  cloudwatch_namespace: GlueDataPipeline
  enable_metrics: true
  enable_continuous_logging: true
  log_level: INFO
  
  # Alerting
  sns_topic_arn: arn:aws:sns:us-east-1:123456789012:GlueAlerts
  
# Job Scheduling
scheduling:
  full_load:
    enabled: false
    schedule: "cron(0 2 * * ? *)"  # Daily at 2 AM UTC
  
  incremental_load:
    enabled: true
    schedule: "rate(1 hour)"  # Every hour
